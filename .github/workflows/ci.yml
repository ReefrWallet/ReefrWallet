name: CI Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install libusb
      run: brew install libusb

    - name: Setup mise
      uses: jdx/mise-action@v2
      env:
        MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install tools
      run: mise install
      env:
        MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run tests
      run: make test
      env:
        # xcodebuild only forwards TEST_RUNNER_-prefixed variables to the test
        # process; this lets `.localNode` tests (Tests/Support/LocalNodeTrait.swift)
        # see CI=true and be skipped.
        TEST_RUNNER_CI: "true"
