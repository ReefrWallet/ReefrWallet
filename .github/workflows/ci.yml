name: Wallet CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install libusb
      run: |
        brew install libusb
    - name: Run tests
      run: |
        curl https://mise.run | sh
        echo "$HOME/.local/share/mise/bin" >> $GITHUB_PATH
        echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
        make test
