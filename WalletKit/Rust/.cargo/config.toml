# Minimum OS versions for the compiled library. Cargo has no first-class
# "deployment target" concept — on Apple platforms this is a linker flag,
# set here per target so it applies whether cargo is invoked directly
# (see ../README.md) or via ../../Makefile.
#
# Keep in sync with the Tuist project deployment targets:
# ../../Project.swift and ../../../Project.swift (both
# `.multiplatform(iOS: "18.0", macOS: "15.0")`).

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-mmacosx-version-min=15.0"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-mmacosx-version-min=15.0"]

# Real devices.
[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-miphoneos-version-min=18.0"]

# Simulators — note the different flag name; `-miphoneos-version-min`
# silently does nothing on a simulator target.
[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-mios-simulator-version-min=18.0"]

[target.x86_64-apple-ios]
rustflags = ["-C", "link-arg=-mios-simulator-version-min=18.0"]
